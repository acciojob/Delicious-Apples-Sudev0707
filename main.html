<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Delicious Apples</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="product-container">
    <div class="product-card">
      <!-- Left side with images -->
      <div class="product__photo">
        <div class="photo-container">
          <div class="photo-main">
            <div class="controls">
              <div class="icon-circle"><i class="fa fa-share-alt"></i></div>
              <div class="icon-circle"><i class="fa fa-heart-o"></i></div>
            </div>
            <img src="https://res.cloudinary.com/john-mantas/image/upload/v1537291846/codepen/delicious-apples/green-apple-with-slice.png"
              alt="Green Apple" />
          </div>
          <div class="photo-album">
            <ul>
              <li><img src="https://res.cloudinary.com/john-mantas/image/upload/v1537302064/codepen/delicious-apples/green-apple2.png" alt="green apple" /></li>
              <li><img src="https://res.cloudinary.com/john-mantas/image/upload/v1537303532/codepen/delicious-apples/half-apple.png" alt="half apple" /></li>
              <li><img src="https://res.cloudinary.com/john-mantas/image/upload/v1537303160/codepen/delicious-apples/green-apple-flipped.png" alt="green apple flipped" /></li>
              <li><img src="https://res.cloudinary.com/john-mantas/image/upload/v1537303708/codepen/delicious-apples/apple-top.png" alt="apple top" /></li>
            </ul>
          </div>
        </div>
      </div>

      <!-- Right side with info -->
      <div class="product__info">
        <div class="title">
          <h1>Delicious Apples</h1>
          <span>CODE: 45999</span>
        </div>

        <div class="price">
          R$ <span>7.93</span>
        </div>

        <div class="variant">
          <h3>SELECT A COLOR</h3>
          <ul>
            <li><img class="selected" src="https://res.cloudinary.com/john-mantas/image/upload/v1537302064/codepen/delicious-apples/green-apple2.png"
                alt="green apple" /></li>
            <li><img src="https://res.cloudinary.com/john-mantas/image/upload/v1537302752/codepen/delicious-apples/yellow-apple.png"
                alt="yellow apple" /></li>
            <li><img src="https://res.cloudinary.com/john-mantas/image/upload/v1537302427/codepen/delicious-apples/orange-apple.png"
                alt="orange apple" /></li>
            <li><img src="https://res.cloudinary.com/john-mantas/image/upload/v1537302285/codepen/delicious-apples/red-apple.png"
                alt="red apple" /></li>
          </ul>
        </div>

        <div class="description">
          <h3>BENEFITS</h3>
          <ul>
            <li>Rich in fiber for better digestion</li>
            <li>Boosts immune system with Vitamin C</li>
            <li>Low in calories — perfect for snacking</li>
            <li>Hydrating and naturally sweet</li>
          </ul>
        </div>

        <button class="add-to-cart">ADD TO CART</button>
      </div>
    </div>
  </div>
</body>

</html>
